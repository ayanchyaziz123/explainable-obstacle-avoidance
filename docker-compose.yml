services:
  ros2:
    build: .
    container_name: explainable_nav
    environment:
      - DISPLAY=host.docker.internal:0
      - TURTLEBOT3_MODEL=waffle_pi
      - QT_X11_NO_MITSHM=1
    volumes:
      - ./ros2_ws/src:/ros2_ws/src
      - ./logs:/ros2_ws/logs
    network_mode: host
    stdin_open: true
    tty: true
